<p>Election Ends In: {{ countdown }}</p>
<p *ngIf="isElectionEnded">Election has ended</p>

<div *ngFor="let candidate of candidates">
  <h3>{{ candidate.name }}</h3>
  <p>Party: {{ candidate.party }}</p>
  <p>Total Votes: {{ candidate.votes }}</p>
  <button type="button" (click)="vote(candidate)" [disabled]="isElectionEnded">Vote</button>
</div>
