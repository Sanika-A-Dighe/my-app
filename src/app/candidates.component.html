<p>Election Ends In: {{ countdown }}</p>
<p *ngIf="isElectionEnded">Election has ended</p>
<label class="captcha-check">
  <input type="checkbox" [(ngModel)]="isHumanChecked" />
  <span>I am not a robot</span>
</label>

<div class="candidate-card" *ngFor="let candidate of candidates">
  <h3>{{ candidate.name }}</h3>
  <p>Party: {{ candidate.party }}</p>
  <p>Total Votes: {{ candidate.votes }}</p>
  <button type="button" (click)="vote(candidate)" [disabled]="isElectionEnded || !isHumanChecked">Vote</button>
</div>

<div class="otp-overlay" *ngIf="showOtpPopup">
  <div class="otp-modal">
    <h3>OTP Verification</h3>
    <p>Enter OTP to confirm your vote.</p>
    <p class="otp-code">Simulated OTP: {{ generatedOtp }}</p>
    <input type="text" maxlength="6" [(ngModel)]="enteredOtp" placeholder="Enter 6-digit OTP" />
    <p class="otp-error" *ngIf="otpError">{{ otpError }}</p>
    <div class="otp-actions">
      <button type="button" (click)="verifyOtpAndSubmit()">Confirm Vote</button>
      <button type="button" class="secondary" (click)="closeOtpPopup()">Cancel</button>
    </div>
  </div>
</div>
