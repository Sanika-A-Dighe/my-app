<section class="success-container">
  <div class="confetti-wrap" aria-hidden="true">
    <span class="confetti c1"></span>
    <span class="confetti c2"></span>
    <span class="confetti c3"></span>
    <span class="confetti c4"></span>
    <span class="confetti c5"></span>
    <span class="confetti c6"></span>
    <span class="confetti c7"></span>
    <span class="confetti c8"></span>
  </div>

  <div class="success-card">
    <div class="checkmark" aria-hidden="true">
      <span class="check-stem"></span>
      <span class="check-kick"></span>
    </div>

    <h1>Voting Done Successfully!</h1>

    <div class="vote-meta" *ngIf="receipt">
      <p><strong>Selected Candidate:</strong> {{ receipt.candidateName }}</p>
      <p><strong>Vote Timestamp:</strong> {{ receipt.votedAt }}</p>
    </div>

    <div class="actions">
      <a routerLink="/receipt" class="receipt-btn">View Receipt</a>
      <a routerLink="/results" class="receipt-btn secondary">View Results</a>
    </div>
  </div>
</section>
